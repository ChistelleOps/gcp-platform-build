
name: Terraform CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"

permissions:
  contents: read

jobs:
  terraform-checks:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform/

      - name: Initialize and validate Terraform configurations
        shell: bash
        run: |
          set -euo pipefail

          for dir in \
            terraform/bootstrap \
            terraform/platform/dev \
            terraform/gitops-bootstrap/dev \
            terraform/gitops-root/dev
          do
            echo "Validating $dir"

            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate -no-color
          done

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Run TFLint
        shell: bash
        run: |
          set -euo pipefail

          for dir in \
            terraform/bootstrap \
            terraform/platform/dev \
            terraform/gitops-bootstrap/dev \
            terraform/gitops-root/dev
          do
            echo "Linting $dir"
            tflint --chdir="$dir" --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact
          done
  security-scan:
    name: Checkov Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Terraform with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          output_format: cli
          quiet: true
          soft_fail: false

